version: 2

updates:
  # No package.json in the workspace carries an engines field: Dependabot runs the Node
  # release it ships (24 on 2026-11-04) and refuses a workspace whose engines fields it
  # cannot satisfy, including those of workspace members. .nvmrc, packageManager and the
  # CI Node setup pin the runtime; the engines fields return before the first publish
  # (roadmap, M1 exit criteria).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    # Versions must be at least one day old, which matches pnpm 11's minimumReleaseAge
    # (one day by default, applied in frozen installs): a pull request is installable
    # when it opens. The two-week wait returns from 1.0.0.
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore(deps)
    groups:
      # Security updates get a pull request of their own.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      # Biome, knip and Vitest change results between releases (which is why
      # they are pinned exactly), so each gets a pull request of its own.
      biome:
        patterns: ["@biomejs/biome"]
      knip:
        patterns: ["knip"]
      vitest:
        patterns: ["vitest"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node.js types follow the runtime major the baseline names (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are taken by hand. packages/type-budgets (attest) and the
      # CLI's typescript-6 alias stay on 6.x for the compiler API in JavaScript, which
      # 7.x does not ship (register entry 138); the workspace compiler changes major
      # together with the baseline (architecture.md section 13).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The one place of each container image: a Dockerfile with a single FROM line. `pnpm pins`
  # copies it into the CLI template, the portal's compose file and the testing package (the copies
  # are written on the Dependabot branch before its checks decide the merge). Minor and patch
  # releases move here; a new major version is a hand edit of the FROM line.
  - package-ecosystem: docker
    directory: /pins
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]
