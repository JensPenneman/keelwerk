name: Release Please

# Releases start at the end of milestone M1 (the first runnable slice). Until then the workflow
# runs only by hand, so no release pull request is opened for an empty toolchain.
on:
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create tags and GitHub releases, push the release branch
      pull-requests: write # open and update the release pull request
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with GITHUB_TOKEN start no workflows, so CI would never run on
          # the release pull request. A GitHub App or fine-grained token in RELEASE_PLEASE_TOKEN
          # (contents and pull requests: write) fixes that; see CONTRIBUTING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
