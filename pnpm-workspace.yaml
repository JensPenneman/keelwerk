packages:
  - packages/*
  - examples/*
  - examples/*/apps/*
  - examples/*/modules/*
  - spikes/*

# pnpm 11 reads its settings from this file; .npmrc only carries registry settings.
saveExact: true
engineStrict: true
strictPeerDependencies: true
preferWorkspacePackages: true
# Packages see only what they declare: nothing is hoisted to the root node_modules.
shamefullyHoist: false
publicHoistPattern: []

# Dependency install scripts are denied unless listed with `true`.
allowBuilds:
  # Git hooks are installed by the root `prepare` script instead.
  lefthook: false
  # Optional native add-ons of testcontainers' SSH and gRPC dependencies; their JavaScript paths suffice.
  cpu-features: false
  protobufjs: false
  ssh2: false

# Transitive dependencies of the write-path spike's testcontainers chain (archiver) with
# open advisories; the fixed releases keep the APIs archiver uses. Drop an entry once the chain
# requires the fixed release itself.
overrides:
  "glob@>=9.0.0 <14.0.2": 14.0.2
  "minimatch@<11.0.1": 11.0.1
  # thread-stream 4.2.1 (via pino) was published on 2026-11-02, inside the 14-day window; 4.2.0 dates from 2026-05-14.
  # Drop this entry once 4.2.1 is older than two weeks.
  "thread-stream@4.2.1": 4.2.0
  # undici below 7.30.1 carries eight advisories and reaches the workspace through @scalar/openapi-parser
  # (a development dependency of transport-rest); 7.30.1 dates from 2026-10-15.
  "undici@>=7.0.0 <7.30.1": 7.30.1
