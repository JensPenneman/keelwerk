packages:
  - packages/*
  - examples/*
  - examples/*/apps/*
  - examples/*/modules/*
  - spikes/*

# pnpm reads its settings from this file; .npmrc only carries registry settings.
saveExact: true
engineStrict: true
strictPeerDependencies: true
preferWorkspacePackages: true
# Packages see only what they declare: nothing is hoisted to the root node_modules.
shamefullyHoist: false
publicHoistPattern: []

# Agent skills that dependencies ship are never linked into this repository.
skills:
  dirs: []

# Dependency install scripts are denied unless listed with `true`.
allowBuilds:
  # Git hooks are installed by the root `prepare` script instead.
  lefthook: false
  # Optional native add-ons of testcontainers' SSH and gRPC dependencies; their JavaScript paths suffice.
  cpu-features: false
  protobufjs: false
  ssh2: false

# Transitive dependencies with open advisories; the fixed releases keep the APIs the parents use
# (glob and minimatch reach the write-path spike's testcontainers chain through archiver). Drop an
# entry once every parent requires the fixed release itself.
overrides:
  "glob@>=9.0.0 <14.0.2": 14.0.6
  "minimatch@<11.0.1": 11.0.9
